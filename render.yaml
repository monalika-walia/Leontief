# Render Blueprint (infrastructure-as-code) — the Leontief backend API + Postgres.
# Deploy: Render Dashboard → New → Blueprint → point at this repo, OR via the
# Render MCP/CLI in an interactive session. Free plan; DATABASE_URL is injected
# from the managed Postgres, the migration runs pre-deploy.
services:
  - type: web
    name: leontief-api
    runtime: node
    plan: free
    rootDir: .
    # pnpm monorepo — Render's global node_modules is read-only, so both
    # `corepack enable` and `npm i -g pnpm` fail (EROFS). Use npx (writable
    # cache). The API self-migrates on startup, so no separate pre-deploy step.
    buildCommand: npx --yes pnpm@10.32.1 install --frozen-lockfile
    startCommand: npx --yes tsx services/api/src/server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leontief-db
          property: connectionString
      - key: PORT
        value: 8787
      # Allow the deployed landing + dApp origins to POST the early-access form.
      - key: CORS_ORIGINS
        value: https://leontief-landing.vercel.app,https://leontief-app.vercel.app
      - key: IP_HASH_SALT
        generateValue: true
      - key: NODE_VERSION
        value: "22"

  # A8 Tier 1 — Telegram access layer. Deployed beside the indexer, sharing the
  # same Postgres (the indexer owns the schema and serves /tg/link).
  #
  # There is deliberately NO key, seed, or signer variable in this block. The bot
  # reads chain state and sends messages; it cannot sign anything, and CI proves
  # it (scripts/check_bot_cannot_sign.sh).
  - type: web
    name: leontief-bot
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@10.32.1 install --frozen-lockfile
    startCommand: npx --yes tsx services/bot/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leontief-db
          property: connectionString
      - key: BOT_PORT
        value: 8789
      # Set in the Render dashboard — never committed. See docs/SECRETS.md.
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: APP_BASE_URL
        value: https://app.leontief.tech
      - key: INDEXER_URL
        sync: false
      - key: RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      # Contract IDs for the live testnet deployment (deployments/testnet.json).
      - key: VAULT
        sync: false
      - key: MINI_POOL
        sync: false
      - key: ORACLE_ADAPTER
        sync: false
      - key: USDC_SAC
        sync: false
      - key: LEOD_SAC
        sync: false
      - key: NODE_VERSION
        value: "22"

databases:
  - name: leontief-db
    plan: free
    postgresMajorVersion: "16"
